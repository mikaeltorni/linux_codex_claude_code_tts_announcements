<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title description">
  <title id="title">Linux Codex and Claude Code TTS Announcements</title>
  <desc id="description">Codex CLI, Claude Code, Cline, and Grok lifecycle events flow through agent-tts to Kokoro voice synthesis and Linux audio playback.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101827"/>
      <stop offset="1" stop-color="#192a3d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#020617" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect width="1280" height="640" rx="34" fill="url(#background)"/>
  <circle cx="1110" cy="68" r="190" fill="#2563eb" opacity=".08"/>
  <circle cx="155" cy="610" r="230" fill="#14b8a6" opacity=".07"/>
  <text x="72" y="91" fill="#5eead4" font-family="Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="3">LINUX · LOCAL VOICES · AGENT HOOKS</text>
  <text x="72" y="151" fill="#f8fafc" font-family="Arial, sans-serif" font-size="39" font-weight="700">Linux Codex/Claude Code TTS Announcements</text>
  <text x="74" y="194" fill="#bdcadb" font-family="Arial, sans-serif" font-size="23">Spoken lifecycle updates for AI coding agents</text>

  <g filter="url(#shadow)">
    <rect x="72" y="253" width="330" height="258" rx="22" fill="#1f3043" stroke="#38516b" stroke-width="2"/>
    <text x="104" y="296" fill="#9fb2c8" font-family="Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="1.5">AGENT EVENTS</text>
    <rect x="102" y="318" width="270" height="38" rx="10" fill="#273b50"/>
    <text x="122" y="344" fill="#f1f5f9" font-family="Arial, sans-serif" font-size="20" font-weight="700">Codex CLI</text>
    <rect x="102" y="365" width="270" height="38" rx="10" fill="#273b50"/>
    <text x="122" y="391" fill="#f1f5f9" font-family="Arial, sans-serif" font-size="20" font-weight="700">Claude Code</text>
    <rect x="102" y="412" width="129" height="38" rx="10" fill="#273b50"/>
    <text x="122" y="438" fill="#f1f5f9" font-family="Arial, sans-serif" font-size="20" font-weight="700">Cline</text>
    <rect x="243" y="412" width="129" height="38" rx="10" fill="#273b50"/>
    <text x="263" y="438" fill="#f1f5f9" font-family="Arial, sans-serif" font-size="20" font-weight="700">Grok</text>
    <text x="104" y="481" fill="#9fb2c8" font-family="Arial, sans-serif" font-size="17">start · finish · attention</text>

    <rect x="474" y="315" width="235" height="132" rx="20" fill="#173c49" stroke="#2dd4bf" stroke-width="2"/>
    <circle cx="516" cy="359" r="15" fill="url(#accent)"/>
    <path d="M510 359h12M516 353v12" stroke="#102331" stroke-width="3" stroke-linecap="round"/>
    <text x="500" y="403" fill="#f0fdfa" font-family="Arial, sans-serif" font-size="29" font-weight="700">agent-tts</text>
    <text x="500" y="429" fill="#b8d8dc" font-family="Arial, sans-serif" font-size="16">hooks · voice · playback</text>

    <rect x="781" y="315" width="205" height="132" rx="20" fill="#24384d" stroke="#52708e" stroke-width="2"/>
    <path d="M811 356c12-17 24 17 36 0s24 17 36 0 24 17 36 0" fill="none" stroke="url(#accent)" stroke-width="5" stroke-linecap="round"/>
    <text x="809" y="403" fill="#f8fafc" font-family="Arial, sans-serif" font-size="27" font-weight="700">Kokoro</text>
    <text x="809" y="429" fill="#bdcadb" font-family="Arial, sans-serif" font-size="16">local voice synthesis</text>

    <rect x="1057" y="315" width="151" height="132" rx="20" fill="#24384d" stroke="#52708e" stroke-width="2"/>
    <path d="M1090 372h17l25-19v55l-25-19h-17z" fill="#93c5fd"/>
    <path d="M1142 365q17 16 0 32M1153 355q28 27 0 52" fill="none" stroke="#5eead4" stroke-width="4" stroke-linecap="round"/>
    <text x="1080" y="422" fill="#f8fafc" font-family="Arial, sans-serif" font-size="19" font-weight="700">Linux audio</text>
  </g>

  <path d="M410 379h45" stroke="url(#accent)" stroke-width="4" stroke-linecap="round"/>
  <path d="m446 369 12 10-12 10" fill="none" stroke="#5eead4" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M717 379h50" stroke="url(#accent)" stroke-width="4" stroke-linecap="round"/>
  <path d="m758 369 12 10-12 10" fill="none" stroke="#5eead4" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M994 379h50" stroke="url(#accent)" stroke-width="4" stroke-linecap="round"/>
  <path d="m1035 369 12 10-12 10" fill="none" stroke="#5eead4" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <path d="M72 546h1136" stroke="#31465e" stroke-width="2"/>
  <text x="72" y="588" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="18">Local Kokoro voices</text>
  <circle cx="284" cy="582" r="4" fill="#5eead4"/>
  <text x="306" y="588" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="18">Configurable voice and speed</text>
  <circle cx="607" cy="582" r="4" fill="#5eead4"/>
  <text x="629" y="588" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="18">Agent binaries remain untouched</text>
</svg>
