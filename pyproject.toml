[project]
name = "linux-codex-claude-code-tts-announcements"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "onnxruntime-gpu[cuda,cudnn]==1.26.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = false
# Ignore packages published in the last 24 hours on every clean installation.
exclude-newer = "24 hours"

[tool.uv.pip]
require-hashes = true
verify-hashes = true
