[package]
name = "agent-tts"
version = "0.1.0"
edition = "2021"
description = "Agent TTS command"

[[bin]]
name = "agent-tts"
path = "src/main.rs"

[[bin]]
name = "tts-hooks"
path = "src/bin/tts-hooks.rs"

[[bin]]
name = "notify-agent"
path = "src/bin/notify-agent.rs"

[dependencies]
serde_json = { version = "1", features = ["preserve_order"] }
